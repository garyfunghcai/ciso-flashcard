接触越多，信息系统越可能遭受攻击，因此避免有恶意攻击可能的人接触信息系统就可以解决信息安全问题", "C": "信息安全问题，产生的根源要从内因和外因两个方面分析，因为信息系统自身存在脆弱性同时外部又有威胁源，从而导致信息系统可能发生安全事件，因此要防范安全风险，需从内外因同时着手", "D": "信息安全问题的根本原因是内因、外因和人三个因素的综合作用，内因和外因都可能导致安全事件的发生，但最重要的还是人的因素，外部攻击者和内部工作人员通过远程攻击，本地破坏和内外勾结等手段导致安全事件发生，因此对人这个因素的防范应是安全工作重点"}, "a": "C", "cat": "CISO", "explanation": "教材P3", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 179, "q": "179.对于关键信息基础设施的理解以下哪项是正确的（）.", "opts": {"A": "关键信息基础建设是国家最为重要的设施，包括三峡大坝水利设施、神州载人航天设施和高铁网络设施", "B": "关键信息基础设施不会向公众提供服务，所以受到攻击损害后不会影响我们的日常生活", "C": "我国总体国家安全观江信息安全作为国家安全的一个重要组成部分，说明缺少信息安全我国的国家安全将无法得到保障", "D": "等级保护定级的系统属于关键信息基础设施"}, "a": "C", "cat": "CISO", "explanation": "A航空航天不是关基、但比关基重要 B关基会对公众提供服务 D等保和关基是两个体系", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 180, "q": "180.为推动和规范我国信息安全等级保护工作，我国制定和发布了信息安全等级保护工作所需要的一系列标准，这些标准可以按照等级保护工作的工作阶段大致分类。下面四个标准中（）规定了等级保护定级阶段的依据、对象、流程、方法及等级变更等内容.", "opts": {"A": "GB／T20271-2006《信息系统通用安全技术要求》", "B": "GB／T 22240-2008《信息系统安全保护等级定级指南》", "C": "GB／T 25070-2010《信息系统等级保护安全设计技术要求》", "D": "GB／T20269-2006《信息系统安全管理要求》"}, "a": "B", "cat": "CISO", "explanation": "", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 181, "q": "181.信息系统建设完成后，（）的信息系统的运营使用单位应当选择符合国家规定的测评机构，进行测评合格后方可投入使用。", "opts": {"A": "二级以上", "B": "三级以上", "C": "四级以上", "D": "五级以上"}, "a": "A", "cat": "CISO", "explanation": "", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 182, "q": "182.根据Bell-LaPadula模型安全策略，下图中写和读操作正确的是（D）.", "opts": {"A": "可读可写", "B": "可读不可写", "C": "可写不可读", "D": "不可读不可写"}, "a": "D", "cat": "CISO", "explanation": "", "cloze": false, "blanks": 0, "fold_point": null}, {"id": 183, "q": "183.以下关于威胁建模流程步骤说法不正确的是（）", "opts": {"A": "威胁建模主要流程包括四步：确定建模对象、识别威胁、评估威胁和消减威胁", "B": "评估威胁是对威胁进行分析，评估被利用和攻击发生的概率，了解被攻击后资产的受损后果，并计算风险", "C": "消减威胁是根据威胁的评估结果，确定是否要消除该威胁以及消减的技术措施，可以通过重新设计直接消除威胁，或设计采用技术手段来消减威胁。", "D": "识别威胁是发现组件或进程存在的威胁，它可能是恶意的，威胁就是漏洞。"}, "a": "D", "cat": "CISO", "explanation": "D是编的 威胁建模四步：确定对象、识别威胁、评估威胁、消减威胁 评估威胁：对威胁进行分析，评估被利用和攻击发生的概率，了解被攻击后资产的受损后果，并计算风险。 消减威胁：根据威胁的评估结果，确定是否要消除该威胁以及消减的技术措施。在设计阶段 可以通过重新设计，以直接消除威胁，或设计采用技术手段来消减威胁在本阶段， 应在确定消减威胁手段后继续评估是否可以接受残余的安全风险。", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 184, "q": "184.在设计信息系统安全保障方案时，以下哪个做法是错误的（）", "opts": {"A": "要充分符合信息安全需求并且实际可行", "B": "要充分考虑成本收益，在满足合规性要求和风险处置要求的前提下，尽量控制成本", "C": "要使用当前最新的技术和成本最高的设备，从而保障信息系统的绝对安全", "D": "要充分考虑用户管理和文化的可接受性，减少系统方案实施障碍"}, "a": "C", "cat": "CISO", "explanation": "用最合适的技术", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 185, "q": "185.应急响应是信息安全事件管理的重要内容。基于应急响应工作的特点和事件的不规则性，事先创定出事件应急响应方法和过程，有助于一个组织在事件发生时阻止混乱的发生成是在混乱状态中迅速恢复控制，将损失和负面影响降到最低。应急响应方法和过程并不是唯一的。一种被广为接受的应急响应方法是将应急响应管理过程分为6个阶段，为准备→检测→遏制-，根除→恢复→跟踪总结。请问下列说法有关于信息安全应急响应管理过程错误的是 ( )", "opts": {"A": "确定重要资产和风险，实施针对风险的防护措施是信息安全应急响应规划过程中最关键的步骤", "B": "在检测阶段，首先要进行监测、报告及信息收集", "C": "遏制措施可能会因为事件的类别和级别不同而完全不同。常见的遏制措施有完全关闭所有系统、拔掉网线等", "D": "应按照应急响应计划中事先制定的业务恢复优先顺序和恢复步骤，顺次恢复相关的系统"}, "a": "A", "cat": "CISO", "explanation": "教材P152,编制管理应急响应计划才是最重要的", "cloze": false, "blanks": 0, "fold_point": null}, {"id": 186, "q": "186.有关系统安全工程-能力成熟度模型(SSE-CMM)中的通用实施(Generic Practices,GP)，错误的理解是：（）.", "opts": {"A": "GP 是涉及过程的管理、测量和制度化方面的活动", "B": "GP 适用于域维中部分过程区域(Process Areas ，PA)的活动而非所有 PA 的活动（课本 170 页内容，GP 是通用实施，适用于所有过程区域）", "C": "在工程实施时，GP 应该作为基本实施(Base，Practices，BP)的一部分加以执行", "D": "在评估时，GP 用于判定工程组织执行某个PA的能力"}, "a": "B", "cat": "CISO", "explanation": "通用实践可用于决定所有活动的能力水平。它们评判涉及过程的管理、测量和制度化能力的最基本批判标准项。 公共特征是由“通用实践”组成逻辑域归类，公共特征的设计是为描述一个组织特有的工作过程(在这种情况下指安全工程域)执行手段的重大变化。每个公共特征有一个或多个通用实践。比如最低的公共特征是l.1“执行基本惯例”。这个公共特征仅仅检查一个组织是否执行了某个过程域的“通用实践”。", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 187, "q": "187.自主访问控制模型（DAC）的访问控制关系可以用访问控制表（ACL）来表示，该ACL利用在客体上附加一个主体明细表的方法来表示访问控制矩阵，通常使用由客体上附加一个主体明细表的方法来表示访问的控制矩阵，通常使用由客体指向的链表来存储相关数据。下面选项中说法正确的是（）", "opts": {"A": "ACL是Bell-LaPadule模型的一种具体实现", "B": "ACL在删除用户时，去除该用户所有的访问权限比较方便", "C": "ACL对于统计某个主体能访问哪些客体比较方便", "D": "ACL在增加客体时，增加相关的访问控制权限较为方便"}, "a": "D", "cat": "CISO", "explanation": "ACL是以客体为中心的表，一个客体一个表，增加客体当然简单", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 188, "q": "188.下面对国家秘密定级和范围的描述中，哪项不符合《保守国家秘密法》要求：（）.", "opts": {"A": "国家秘密及其密级的具体范围，由国家保密工作部门分别会同外交、公安、国家安全和其他中央有关机关规定", "B": "各级国家机关、单位对所产生的国家秘密事项，应当按照国家秘密及其密级具体范围的规定确定密级", "C": "对是否属于国家机密和属于何种密级不明确的事项，可由各单位自行参考国家要求确定和定级，然后报国家保密工作部门确定", "D": "对是否属于国家秘密和属于何种密级不明确的事项。由国家保密工作部门，省、自治区、直辖市的保密工作部门。省、自治区政府所在地的市和经国务院批准的较大的市的保密工作部门或者国家保密工作部门审定的机关确定。"}, "a": "C", "cat": "CISO", "explanation": "", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 189, "q": "189.在风险管理中，残余风险是指实施了新的或增强的安全措施后还剩下的风险，关于残余风险，下面描述错误的是（）.", "opts": {"A": "风险处理措施确定以后，应编制详细的残余风险清单，并获得管理层对残余风险的书面批准，这也是风险管理中的一个重要过程", "B": "管理层确认接收残余风险,是对风险评估工作的一种肯定,表示管理层已经全面了解了组织所面临的风险,并理解在风险一旦变为现实后,组织能够且必须承担引发的后果", "C": "接收残余风险,则表明没有必要防范和加固所有的安全漏洞,也没有必要无限制的提高安全保护措施的强度,对安全保护措施的选择要考虑到成本和技术等因素的限制", "D": "如果残余风险没有降低到可接受的级别,则只能被动的选择接受风险,即对风险不进行下一步的处理措施,接受风险可能带来的结果。"}, "a": "D", "cat": "CISO", "explanation": "", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 190, "q": "190.某单位信息安全岗位员工，利用个人业余时间，在社交网络平台上向业内同不定期发布信息安全相关知识和前沿动态资讯，这一行为主要符合以下哪一条注册信息安全专业人员（CISP）职业道德准则：（）.", "opts": {"A": "避免任何损害CISP声誉形象的行为", "B": "自觉维护公众信息安全，拒绝并抵制通过计算机网络系统泄露个人隐私的行为", "C": "帮助和指导信息安全同行提升信息安全保障知识和能力", "D": "不在公众网络传播反动、暴力、黄色、低俗信息及非法软件"}, "a": "C", "cat": "CISO", "explanation": "", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 191, "q": "191.随着信息技术的不断发展，信息系统的重要性也越来越突出。而与此同时，发生的信息安全事件也越来越多。综合分析信息安全问题产生的根源，下面播述正确的是().", "opts": {"A": "信息系统自身存在前弱性是根本原因。信息系统越来越重要，同时自身在开发、部器和使用过程中存在的脆弱性，导致了请多的信息安全事件发生，因此，杜绝脆弱性的存在是解决信息安全问题的根本所在", "B": "信息系统面临请多黑客的威胁，包括恶意攻击者和恶作剧攻击者。 信息系统应用越来越广泛，接触信息系统的人越多，信息系统越可能遭受攻击。因此，避免有恶意攻击可能的人接触信息系统就可以解决信息安全问题", "C": "信息安全问题产生的根源要从内因和外因两个方面分析，因为信息系统自身存在脆弱性，同时外部又有威胁源，从而导致信息系统可能发生安全事件，因此，要防范信息安全风险，需从内外因同时着手", "D": "信息安全问题的根本原因是内因、外因和人三个因素的综合作用，内因和外因都可能导致安全事件的发生，但最重要的还是人的因素，外部攻击者和内部工作人员通过远程攻击、本地破坏和内外勾结等手段导致安全事件发生。因此。对人这个因素的防范应是安全工作重点"}, "a": "C", "cat": "CISO", "explanation": "教材P3", "cloze": false, "blanks": 1, "fold_point": null}, {"id": 192, "q": "192.关于信息安全管理体系（ISMS）的作用，下面理解错误的是( ).", "opts": {"A": "信息安全管理体系是组织在整体或特定范围内建立信息安全方针和目标，以及完成这些目标所用方法的体系，包括组织架构、方针、活动、职责及相关实践要素", "B": "管理体系是为达到组织目标的策略、程序、指南和相关资源的框架，信息安全管理体系是管理体系思想和方法在信息安全领域的应用", "C": "概念上，信息安全管理体系有广义和狭义之分，狭义的信息安全管理体系是按照ISO27001标准定义的管理体系，它是一个组织整体管理体系的组成部分", "D": "同其他管理体系一样，信息安全管理体系也要建立信息安全管理组织机构、健全信息安全管理制度、构建信息安全技术防护体系和加强人员的安全意识等内容"}, "a": "D", "cat": "CISO", "explanation": "D是编的", "cloze": false, "blanks": 0, "fold_point": null}, {"id": 193, "q": "193.主体和客体是访问控制模型中常用的概念，下面描述错误的是（）.", "opts": {"A": "主体是访问的发起者，是一个主动的实体，可以操作被动实体的相关信息或数据", "B": "客体也是一种实体，是操作的对象，是被规定需要保护的资源", "C": "主体是动作的实施者，比如人、进程或设备等均是主体，这些对象不能被当作客体使用", "D": "一个主体为了完成任务，可以创建另外的主体，这些主体可以独立运行"}, "a": "C", "cat": "CISO", "explanation": "有的时候主题也能在其他场景成为客体，比如设备", "cloze": false, "blanks": 1, "fold_point": null}]

const LS_KEY = 'ciso_flashcard_v1';
let state = {
  answered: {},      // {qid: {c: 0|1, ua: 'A'}}
  bookmarks: [],     // [qid, ...]
  expanded: {},      // {qid: true} 展開過的題目
  currentIdx: 0,
  shuffled: false
};

function loadState() {
  try {
    const saved = localStorage.getItem(LS_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch(e) { console.error('loadState:', e); }
}

function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch(e) { console.error('saveState:', e); }
}

// === 工具 ===
const $ = id => document.getElementById(id);
const CATS = [...new Set(QUESTIONS.map(q => q.cat))].sort();

function populateCats() {
  // CISO 題目無分類，filter-cat 只剩 "all" 一個 option
  $('filter-cat').innerHTML = '<option value="all">📚 全部題目</option>';
}

function getFilteredQuestions() {
  const cat = $('filter-cat').value;
  const mode = $('filter-mode').value;
  let qs = QUESTIONS.slice();
  if (cat !== 'all') qs = qs.filter(q => q.cat === cat);
  if (mode === 'wrong') qs = qs.filter(q => state.answered[q.id] && state.answered[q.id].c === 0);
  else if (mode === 'bookmark') qs = qs.filter(q => state.bookmarks.includes(q.id));
  else if (mode === 'unanswered') qs = qs.filter(q => !state.answered[q.id]);

  else if (mode === 'cloze') qs = qs.filter(q => q.cloze);
  if (state.shuffled) qs = qs.sort(() => Math.random() - 0.5);
  return qs;
}

function updateStats() {
  const correct = Object.values(state.answered).filter(a => a.c === 1).length;
  const wrong = Object.values(state.answered).filter(a => a.c === 0).length;
  $('stat-correct').textContent = correct;
  $('stat-wrong').textContent = wrong;
  $('stat-bookmark').textContent = state.bookmarks.length;
  const answered = Object.keys(state.answered).length;
  $('stat-remaining').textContent = QUESTIONS.length - answered;
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function render() {
  const qs = getFilteredQuestions();
  updateStats();
  const progress = (Object.keys(state.answered).length / QUESTIONS.length) * 100;
  $('progress').style.width = `${progress}%`;
  
  const content = $('content');
  if (qs.length === 0) {
    content.innerHTML = '<div class="empty-state">📭 呢個分類冇題目</div>';
    return;
  }
  
  if (state.currentIdx >= qs.length) state.currentIdx = 0;
  const q = qs[state.currentIdx];
  const isBookmarked = state.bookmarks.includes(q.id);
  const ans = state.answered[q.id];
  
  let optsHtml = '';
  ['A','B','C','D'].forEach(k => {
    let cls = 'opt';
    if (ans) {
      cls += ' disabled';
      if (k === q.a) cls += ' correct';
      else if (k === ans.ua) cls += ' wrong';
    }
    optsHtml += `
      <div class="${cls}" data-key="${k}">
        <div class="opt-key">${k}</div>
        <div>${renderMd(q.opts[k])}</div>
      </div>
    `;
  });
  
  let fbHtml = '';
  if (ans) {
    const correct = ans.c === 1;
    fbHtml = `<div class="feedback show ${correct ? 'right' : 'wrong'}">
      ${correct ? '✅ 答啱！' : `❌ 答錯，你揀咗 ${ans.ua}，正確答案係 <b>${q.a}</b>`}
    </div>`;
  }
  
  // 摺疊挖空題 (cloze = 題幹≥2 個 （）)
  const isCloze = q.cloze && q.fold_point && q.fold_point < q.q.length - 5;
  const qTextHtml = isCloze && !state.expanded[q.id]
    ? `<div class="q-fade"><div class="q-text">${renderMd(q.q.slice(0, q.fold_point))}</div></div>
       <button class="q-toggle" id="q-toggle">▼ 展開題目 (${q.q.length - q.fold_point} 字)</button>`
    : `<div class="q-text">${renderMd(q.q)}</div>${isCloze ? `<button class="q-toggle" id="q-toggle">▲ 摺疊題目</button>` : ''}`;

  content.innerHTML = `
    <div class="question-card">
      <div class="q-header">
        <span class="q-id">題 ${q.id} · ${state.currentIdx + 1}/${qs.length}</span>
        <span class="q-cat">${q.cat}${q.cloze ? ` · ${q.blanks} 個空白` : ''}</span>
        <div class="q-actions">
          <button id="bookmark-btn" class="${isBookmarked ? 'q-bookmarked' : ''}" title="書籤 (B)">
            ${isBookmarked ? '⭐' : '☆'}
          </button>
        </div>
      </div>
      ${qTextHtml}
      <div class="options">${optsHtml}</div>
      ${fbHtml}
      <div class="nav">
        <button id="prev">◀ 上一題 (←)</button>
        <button id="reveal" class="primary" style="flex: 2">${ans ? '下一題 (Space)' : '顯示答案 (R)'}</button>
        <button id="next">下一題 (→)</button>
      </div>
    </div>
  `;
  
  // 綁事件
  const tgl = $('q-toggle');
  if (tgl) tgl.onclick = () => {
    state.expanded[q.id] = !state.expanded[q.id];
    saveState();
    render();
  };
  $('bookmark-btn').onclick = toggleBookmark;
  $('prev').onclick = () => { if (state.currentIdx > 0) state.currentIdx--; render(); saveState(); };
  $('next').onclick = () => { if (state.currentIdx < qs.length - 1) state.currentIdx++; render(); saveState(); };
  $('reveal').onclick = nextOrReveal;
  
  document.querySelectorAll('.opt').forEach(el => {
    el.onclick = () => {
      if (ans) return;
      const k = el.dataset.key;
      const correct = k === q.a ? 1 : 0;
      state.answered[q.id] = { c: correct, ua: k };
      saveState();
      render();
    };
  });
}

function nextOrReveal() {
  const qs = getFilteredQuestions();
  const q = qs[state.currentIdx];
  if (!state.answered[q.id]) {
    state.answered[q.id] = { c: 0, ua: null };
    saveState();
    render();
  } else {
    if (state.currentIdx < qs.length - 1) state.currentIdx++;
    saveState();
    render();
  }
}

function toggleBookmark() {
  const qs = getFilteredQuestions();
  const q = qs[state.currentIdx];
  const idx = state.bookmarks.indexOf(q.id);
  if (idx >= 0) {
    state.bookmarks.splice(idx, 1);
    showToast('書籤已移除');
  } else {
    state.bookmarks.push(q.id);
    showToast('⭐ 已加入書籤');
  }
  saveState();
  render();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

// 將 markdown 圖片語法 ![](./pic/N.png) 轉成 <img>
// 圖片 hotlink 自 https://raw.githubusercontent.com/npcola/CISP/main/pic/
const PIC_BASE = 'https://raw.githubusercontent.com/npcola/CISP/main/pic/';
function renderMd(s) {
  const esc = escapeHtml(s);
  return esc.replace(/!\[\]\(\.\/pic\/([^\s)]+)\)/g, (_, fname) =>
    `<img class="q-img" src="${PIC_BASE}${fname}" alt="${fname}" loading="lazy" onerror="this.style.display='none'">`
  );
}

// === Import / Export ===
function exportProgress() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cisp-flashcard-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 進度已匯出');
}

function importProgress() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (confirm('匯入會覆蓋當前進度，確定？')) {
          state = { ...state, ...imported };
          saveState();
          render();
          showToast('📂 進度已匯入');
        }
      } catch(err) {
        alert('匯入失敗: ' + err.message);
      }
    };
    r.readAsText(f);
  };
  input.click();
}

function resetAll() {
  if (!confirm('確定重置所有答題記錄同書籤？此操作無法撤銷。')) return;
  state = { answered: {}, bookmarks: [], currentIdx: 0, shuffled: false };
  saveState();
  render();
  showToast('🔄 已重置');
}

// === 鍵盤 ===
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (['1','2','3','4'].includes(e.key)) {
    const opt = document.querySelector(`.opt[data-key="${e.key}"]`);
    if (opt && !opt.classList.contains('disabled')) opt.click();
  } else if (k === ' ') {
    e.preventDefault();
    nextOrReveal();
  } else if (k === 'b') {
    toggleBookmark();
  } else if (k === 'r') {
    nextOrReveal();
  } else if (k === 'e') {
    // 展開/摺疊當前題目
    const qs2 = getFilteredQuestions();
    const q2 = qs2[state.currentIdx];
    if (q2) {
      state.expanded[q2.id] = !state.expanded[q2.id];
      saveState();
      render();
    }
  } else if (k === 'arrowleft') {
    if (state.currentIdx > 0) { state.currentIdx--; render(); saveState(); }
  } else if (k === 'arrowright') {
    const qs = getFilteredQuestions();
    if (state.currentIdx < qs.length - 1) { state.currentIdx++; render(); saveState(); }
  }
});

// === Init ===
loadState();
populateCats();
$('filter-cat').onchange = () => { state.currentIdx = 0; render(); };
$('filter-mode').onchange = () => { state.currentIdx = 0; render(); };
$('shuffle').onclick = () => { state.shuffled = !state.shuffled; state.currentIdx = 0; render(); showToast(state.shuffled ? '🔀 已洗牌' : '➡️ 恢復順序'); };
$('export').onclick = exportProgress;
$('import').onclick = importProgress;
$('reset').onclick = resetAll;
render();
</script>
</body>
</html>
